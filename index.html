
<!DOCTYPEhtml> 
<html lang="english">
<head>
    <meta charset="utf 8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>BMI calculator</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
<div  class="container">
    <div class="header">

    <h2>BMI CALCULATOR<h2>
    </div>
<div class="inputgroup">
    <label for="height"> 
        Height(in cm):</label>
        <input type="number" id="height" name="height" placeholder="E.g.: 160">
        <br>
</div>
<div class="inputgroup">
    <label for="weight">
        Weight(in kg):</label>
    <input type="number" id="weight" name="weight" placeholder="E.g.:45">
<br>
</div>

    <button id="calculate-btn"onclick="calculatebmi()" type="button">Calculate BMI</button>

<div id="result-container" class="hidden">
    <h3>Your BMI is:<span id="bmi-value"></span></h3>
    <p id="bmi-category">
        <div id="bmi-square" class="bmi-square"></div>
    </p>
</div></div>
<script src="script.js"> </script>
</body>
</html>

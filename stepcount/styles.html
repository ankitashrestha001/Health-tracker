<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Step Tracker</title>
    <style>
        /* 1. BASIC PAGE LAYOUT (Matches your original colors!) */
        body {
            font-family: Arial, sans-serif;
            background-color: lightpink;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: rgb(104, 156, 130);
            padding: 20px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .header {
            background-color: palevioletred;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* 2. INPUTS & BUTTONS */
        .input-group {
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: none;
            border-radius: 6px;
            box-sizing: border-box; /* Keeps padding inside the 100% width */
        }

        button {
            width: 100%;
            background-color: palevioletred;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #c75b7a;
        }

        /* 3. SIMPLE PROGRESS BAR (Goal: 10,000 steps) */
        .progress-container {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            height: 22px;
            width: 100%;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-bar {
            background-color: palevioletred;
            height: 100%;
            width: 0%; /* JavaScript will change this percentage! */
            text-align: center;
            font-size: 12px;
            line-height: 22px;
            font-weight: bold;
            transition: width 0.5s ease;
        }

        /* 4. SIMPLE CSS BAR GRAPH */
        .chart-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 120px;
        }

        .bar {
            width: 28px;
            background-color: palevioletred;
            border-radius: 4px 4px 0 0;
            text-align: center;
            font-size: 10px;
            color: white;
        }

        /* 5. SAVED LOGS LIST */
        .log-card {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Step Tracker</h2>
        </div>

        <!-- INPUT SECTION -->
        <div class="input-group">
            <label>Steps Walked:</label>
            <input type="number" id="steps" placeholder="Enter steps (e.g. 7500)">
        </div>

        <div class="input-group">
            <label>Date:</label>
            <input type="date" id="date">
        </div>

        <div class="input-group">
            <label>Time:</label>
            <input type="time" id="time">
        </div>

        <button id="saveBtn">Calculate & Save</button>

        <!-- LATEST DAY FEEDBACK & PROGRESS BAR -->
        <div id="latestSummary" style="display: none; margin-top: 20px;">
            <h3 id="dayRating" style="margin-bottom: 5px;"></h3>
            <p id="dayNote" style="font-size: 14px; margin: 0;"></p>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar">0%</div>
            </div>
            
            <p id="mathResults" style="font-size: 14px; font-weight: bold;"></p>
        </div>

        <!-- SIMPLE VISUAL GRAPH -->
        <h4 style="margin-bottom: 5px;">Recent Steps Graph</h4>
        <div class="chart-box" id="chartBox">
            <p style="font-size: 13px;">Save steps to see graph</p>
        </div>

        <!-- SAVED HISTORY -->
        <h4>Saved History</h4>
        <div id="historyList"></div>
    </div>

    <script>
        // STEP 1: Connect JavaScript to our HTML elements
        const stepsInput = document.getElementById("steps");
        const dateInput = document.getElementById("date");
        const timeInput = document.getElementById("time");
        const saveBtn = document.getElementById("saveBtn");

        // STEP 2: Load saved data from browser memory (or start with an empty list)
        let savedLogs = JSON.parse(localStorage.getItem("myStepLogs")) || [];

        // Show any previously saved data right when the page opens
        updateScreen();

        // STEP 3: What happens when the button is clicked
        saveBtn.addEventListener("click", function() {
            const steps = Number(stepsInput.value);
            const date = dateInput.value;
            const time = timeInput.value;

            // Check if the user forgot to fill out a box
            if (steps <= 0 || date === "" || time === "") {
                alert("Please enter valid steps, date, and time!");
                return;
            }

            // Do the math
            const distanceKm = (steps * 0.000762).toFixed(2);
            const calories = Math.round(steps * 0.04);

            // Decide the rating and short note using simple if/else logic
            let rating = "";
            let note = "";

            if (steps < 5000) {
                rating = "Sedentary Day";
                note = "Low movement today. Try taking a short walk tomorrow!";
            } else if (steps < 10000) {
                rating = "Moderately Active";
                note = "Good job! You are getting close to the 10,000-step goal.";
            } else {
                rating = "Excellent!";
                note = "Amazing work! You crushed your daily step goal.";
            }

            // Bundle all details for this day into one object
            const newEntry = {
                steps: steps,
                date: date,
                time: time,
                distance: distanceKm,
                calories: calories,
                rating: rating,
                note: note
            };

            // Add to our list and save to localStorage
            savedLogs.push(newEntry);
            localStorage.setItem("myStepLogs", JSON.stringify(savedLogs));

            // Update the visual display and clear the steps box
            updateScreen();
            stepsInput.value = "";
        });

        // STEP 4: Function to draw the summary, graph, and history list
        function updateScreen() {
            if (savedLogs.length === 0) return;

            // Get the most recently added entry
            const latest = savedLogs[savedLogs.length - 1];

            // 1. Update Latest Summary & Progress Bar
            document.getElementById("latestSummary").style.display = "block";
            document.getElementById("dayRating").textContent = "Status: " + latest.rating;
            document.getElementById("dayNote").textContent = latest.note;
            document.getElementById("mathResults").textContent = 
                "Distance: " + latest.distance + " km | Calories: " + latest.calories + " kcal";

            // Calculate percentage out of 10,000 steps (max 100%)
            let percent = Math.min(Math.round((latest.steps / 10000) * 100), 100);
            const progressBar = document.getElementById("progressBar");
            progressBar.style.width = percent + "%";
            progressBar.textContent = percent + "%";

            // 2. Update the Simple Bar Graph (last 5 entries)
            const chartBox = document.getElementById("chartBox");
            chartBox.innerHTML = ""; // Clear old bars
            const recentLogs = savedLogs.slice(-5);

            recentLogs.forEach(function(item) {
                // Scale bar height (10,000 steps = 100px tall)
                let barHeight = Math.min((item.steps / 10000) * 100, 100);
                if (barHeight < 15) barHeight = 15; // Minimum height so label fits

                const bar = document.createElement("div");
                bar.className = "bar";
                bar.style.height = barHeight + "px";
                bar.textContent = item.steps;
                chartBox.appendChild(bar);
            });

            // 3. Update the History List (newest on top)
            const historyList = document.getElementById("historyList");
            historyList.innerHTML = "";

            savedLogs.slice().reverse().forEach(function(item) {
                const card = document.createElement("div");
                card.className = "log-card";
                card.innerHTML = `
                    <strong>${item.date} (${item.time}) — ${item.rating}</strong><br>
                    Steps: ${item.steps} | ${item.distance} km | ${item.calories} kcal<br>
                    <em>"${item.note}"</em>
                `;
                historyList.appendChild(card);
            });
        }
    </script>
</body>
</html>

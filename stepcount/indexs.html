<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Tracker & Analytics</title>
    <style>
        /* =========================================
           1. GLOBAL STYLES & COLOR PALETTE
           ========================================= */
        :root {
            --bg-pink: #ffe4e8;
            --card-sage: #689c82;
            --accent-rose: #d87093;
            --accent-rose-dark: #b85275;
            --text-dark: #1f2937;
            --text-light: #ffffff;
            --card-white: rgba(255, 255, 255, 0.94);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-pink);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* =========================================
           2. NAVIGATION BAR (PAGE SWITCHER)
           ========================================= */
        .nav-bar {
            display: flex;
            gap: 10px;
            background: var(--card-white);
            padding: 8px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 24px;
            width: 100%;
            max-width: 480px;
        }

        .nav-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: var(--text-dark);
            transition: all 0.25s ease;
        }

        .nav-btn.active {
            background: var(--accent-rose);
            color: var(--text-light);
            box-shadow: 0 3px 10px rgba(216, 112, 147, 0.4);
        }

        /* =========================================
           3. PAGE CONTAINERS & SPA TRANSITIONS
           ========================================= */
        .page {
            display: none;
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Main Sage Card Styling */
        .card {
            background-color: var(--card-sage);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .header {
            background-color: var(--accent-rose);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header h2 {
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        /* =========================================
           4. INPUT FORM & BUTTONS (PAGE 1)
           ========================================= */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            outline: none;
            background: var(--card-white);
            color: var(--text-dark);
        }

        .btn-primary {
            width: 100%;
            background-color: var(--accent-rose);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background-color: var(--accent-rose-dark);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            width: 100%;
            background-color: rgba(255,255,255,0.22);
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 11px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background-color: rgba(255,255,255,0.32);
        }

        /* =========================================
           5. ACTIVITY RATING FEEDBACK CARD
           ========================================= */
        .feedback-box {
            margin-top: 18px;
            background: var(--card-white);
            color: var(--text-dark);
            border-radius: 14px;
            padding: 16px;
            display: none;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        /* =========================================
           6. CIRCULAR SVG PROGRESS RINGS (PAGE 2)
           ========================================= */
        .analytics-card {
            background: var(--card-white);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }

        .ring-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ring-wrapper {
            position: relative;
            width: 96px;
            height: 96px;
        }

        .ring-wrapper svg {
            transform: rotate(-90deg); /* Start circle fill at 12 o'clock */
            width: 96px;
            height: 96px;
        }

        .ring-bg {
            fill: none;
            stroke: #e5e7eb;
            stroke-width: 8;
        }

        .ring-progress {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 251.2; /* 2 * PI * r (r = 40) */
            stroke-dashoffset: 251.2;
            transition: stroke-dashoffset 0.8s ease-out;
        }

        .ring-center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .ring-label {
            font-size: 12px;
            font-weight: 600;
            color: #4b5563;
            margin-top: 6px;
        }

        /* =========================================
           7. GRAPH & DATABASE HISTORY LIST
           ========================================= */
        canvas {
            width: 100%;
            height: 200px;
            display: block;
        }

        .chart-toggle {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            cursor: pointer;
            font-weight: 600;
        }

        .history-list {
            list-style: none;
            max-height: 260px;
            overflow-y: auto;
        }

        .history-item {
            background: #f8fafc;
            border-left: 5px solid var(--accent-rose);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
            position: relative;
        }

        .history-item:hover {
            background: #f1f5f9;
            transform: translateX(3px);
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #fca5a5;
        }
    </style>
</head>
<body>

    <!-- =========================================
         TOP NAVIGATION BAR (SWITCHES PAGES)
         ========================================= -->
    <div class="nav-bar">
        <button class="nav-btn active" id="navInputBtn" onclick="switchPage('inputPage')">Log Steps</button>
        <button class="nav-btn" id="navOutputBtn" onclick="switchPage('outputPage')">Analytics & Rings</button>
    </div>

    <!-- =========================================
         PAGE 1: STEP TRACKER INPUT & DAY FEEDBACK
         ========================================= -->
    <div class="page active" id="inputPage">
        <div class="card">
            <div class="header">
                <h2>Step Tracker</h2>
            </div>

            <div class="form-group">
                <label for="steps">Steps Walked Today</label>
                <input type="number" id="steps" placeholder="e.g. 8500" min="1">
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date">
            </div>

            <div class="form-group">
                <label for="time">Time</label>
                <input type="time" id="time">
            </div>

            <button class="btn-primary" id="saveBtn">Calculate & Save to Database</button>
            <button class="btn-secondary" onclick="switchPage('outputPage')">View Circular Rings & Graph →</button>

            <!-- Instant Rating & Short Note Box -->
            <div class="feedback-box" id="feedbackBox">
                <span class="badge" id="ratingBadge">Rating</span>
                <p id="ratingNote" style="font-size: 14px; line-height: 1.4; margin-bottom: 6px;"></p>
                <p id="quickMetrics" style="font-size: 13px; color: #6b7280; font-weight: 600;"></p>
            </div>
        </div>
    </div>

    <!-- =========================================
         PAGE 2: CIRCULAR RINGS, GRAPH & DATABASE
         ========================================= -->
    <div class="page" id="outputPage">
        <!-- 1. Circular Progress Rings Card -->
        <div class="analytics-card">
            <div class="section-title">
                <span id="ringCardTitle">Selected Day Overview</span>
                <span id="ringRatingBadge" class="badge" style="margin:0; font-size:11px;">No Data</span>
            </div>

            <div class="rings-grid">
                <!-- Steps Ring -->
                <div class="ring-item">
                    <div class="ring-wrapper">
                        <svg>
                            <circle class="ring-bg" cx="48" cy="48" r="40"></circle>
                            <circle class="ring-progress" id="stepsRing" cx="48" cy="48" r="40" stroke="#d87093"></circle>
                        </svg>
                        <div class="ring-center-text" id="stepsRingText">0</div>
                    </div>
                    <div class="ring-label">Steps / 10k</div>
                </div>

                <!-- Distance Ring -->
                <div class="ring-item">
                    <div class="ring-wrapper">
                        <svg>
                            <circle class="ring-bg" cx="48" cy="48" r="40"></circle>
                            <circle class="ring-progress" id="distRing" cx="48" cy="48" r="40" stroke="#689c82"></circle>
                        </svg>
                        <div class="ring-center-text" id="distRingText">0 km</div>
                    </div>
                    <div class="ring-label">Distance</div>
                </div>

                <!-- Calories Ring -->
                <div class="ring-item">
                    <div class="ring-wrapper">
                        <svg>
                            <circle class="ring-bg" cx="48" cy="48" r="40"></circle>
                            <circle class="ring-progress" id="calRing" cx="48" cy="48" r="40" stroke="#f59e0b"></circle>
                        </svg>
                        <div class="ring-center-text" id="calRingText">0</div>
                    </div>
                    <div class="ring-label">Calories</div>
                </div>
            </div>

            <p id="selectedDayNote" style="margin-top:14px; font-size:13px; color:#374151; background:#f3f4f6; padding:10px; border-radius:8px; text-align:center;">
                Log steps or click any entry below to view its circular breakdown.
            </p>
        </div>

        <!-- 2. Interactive Step Trend Chart Card -->
        <div class="analytics-card">
            <div class="section-title">
                <span>Step History Graph</span>
                <button class="chart-toggle" id="toggleChartBtn">Switch to Line</button>
            </div>
            <canvas id="stepChart" width="420" height="200"></canvas>
        </div>

        <!-- 3. Saved Database Records Card -->
        <div class="analytics-card">
            <div class="section-title">
                <span>Saved Database Logs</span>
                <span id="recordCount" style="font-size:12px; color:#6b7280;">0 entries</span>
            </div>
            <ul class="history-list" id="historyList"></ul>
        </div>
    </div>

    <script>
        /* ==============================================================
           1. CONFIGURATION & INITIALIZATION
           ============================================================== */
        const DAILY_GOAL = 10000;
        const RING_CIRCUMFERENCE = 2 * Math.PI * 40; // ~251.2px for radius 40
        let db = null;
        let allRecords = [];
        let chartType = 'bar'; // 'bar' or 'line'

        // Set default Date and Time inputs to current local date/time
        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            document.getElementById('date').value = now.toISOString().split('T')[0];
            document.getElementById('time').value = now.toTimeString().slice(0, 5);
            initDatabase();
        });

        /* ==============================================================
           2. INDEXEDDB DATABASE SETUP & CRUD OPERATIONS
           ============================================================== */
        function initDatabase() {
            // Open (or create) IndexedDB database named "StepTrackerDB"
            const request = indexedDB.open("StepTrackerDB", 1);

            // Runs when database is first created or upgraded
            request.onupgradeneeded = (event) => {
                const database = event.target.result;
                if (!database.objectStoreNames.contains("stepLogs")) {
                    // Create an object store with auto-incrementing ID
                    database.createObjectStore("stepLogs", { keyPath: "id", autoIncrement: true });
                }
            };

            request.onsuccess = (event) => {
                db = event.target.result;
                loadAllRecords(); // Fetch existing records on startup
            };

            request.onerror = () => {
                console.warn("IndexedDB unavailable; falling back to localStorage.");
                allRecords = JSON.parse(localStorage.getItem("stepLogsFallback")) || [];
                refreshAnalyticsUI();
            };
        }

        // Save a new step entry into IndexedDB
        function saveRecordToDB(record) {
            if (!db) {
                record.id = Date.now();
                allRecords.push(record);
                localStorage.setItem("stepLogsFallback", JSON.stringify(allRecords));
                refreshAnalyticsUI(record);
                return;
            }

            const transaction = db.transaction(["stepLogs"], "readwrite");
            const store = transaction.objectStore("stepLogs");
            const addRequest = store.add(record);

            addRequest.onsuccess = (e) => {
                record.id = e.target.result;
                loadAllRecords(record);
            };
        }

        // Load all saved step entries from IndexedDB
        function loadAllRecords(selectedRecord = null) {
            if (!db) {
                refreshAnalyticsUI(selectedRecord);
                return;
            }

            const transaction = db.transaction(["stepLogs"], "readonly");
            const store = transaction.objectStore("stepLogs");
            const getAllRequest = store.getAll();

            getAllRequest.onsuccess = () => {
                allRecords = getAllRequest.result;
                // Sort chronologically by date and time
                allRecords.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));
                refreshAnalyticsUI(selectedRecord);
            };
        }

        // Delete a specific record by ID
        function deleteRecord(id, event) {
            event.stopPropagation(); // Prevent triggering the row click selection
            if (!db) {
                allRecords = allRecords.filter(r => r.id !== id);
                localStorage.setItem("stepLogsFallback", JSON.stringify(allRecords));
                refreshAnalyticsUI();
                return;
            }

            const transaction = db.transaction(["stepLogs"], "readwrite");
            const store = transaction.objectStore("stepLogs");
            store.delete(id).onsuccess = () => loadAllRecords();
        }

        /* ==============================================================
           3. ACTIVITY RATING ENGINE (SHORT NOTES & BADGES)
           ============================================================== */
        function evaluateDay(steps) {
            if (steps < 5000) {
                return {
                    label: "Sedentary Day",
                    color: "#ef4444", // Red
                    note: "Low movement today. Try adding a short 15-minute evening walk tomorrow!"
                };
            } else if (steps < 7500) {
                return {
                    label: "Lightly Active",
                    color: "#f59e0b", // Amber
                    note: "Good baseline movement! A bit more brisk walking will push you into the active zone."
                };
            } else if (steps < 10000) {
                return {
                    label: "Moderately Active",
                    color: "#3b82f6", // Blue
                    note: "Great job! You are very close to hitting the 10,000-step daily health benchmark."
                };
            } else if (steps < 12500) {
                return {
                    label: "Active & Healthy",
                    color: "#10b981", // Emerald Green
                    note: "Goal crushed! You maintained an active, heart-healthy routine today."
                };
            } else {
                return {
                    label: "Excellent!",
                    color: "#8b5cf6", // Purple
                    note: "Outstanding endurance! You went well above and beyond your daily step target."
                };
            }
        }

        /* ==============================================================
           4. FORM SUBMISSION & PAGE NAVIGATION
           ============================================================== */
        document.getElementById("saveBtn").addEventListener("click", () => {
            const steps = parseInt(document.getElementById("steps").value);
            const date = document.getElementById("date").value;
            const time = document.getElementById("time").value;

            if (!steps || steps <= 0 || !date || !time) {
                alert("Please enter valid steps, date, and time.");
                return;
            }

            // Calculate distance (avg stride ~0.762m) and calories (~0.04 kcal/step)
            const distance = parseFloat((steps * 0.000762).toFixed(2));
            const calories = Math.round(steps * 0.04);
            const evaluation = evaluateDay(steps);

            const newRecord = {
                steps,
                date,
                time,
                distance,
                calories,
                rating: evaluation.label,
                color: evaluation.color,
                note: evaluation.note
            };

            // Show immediate feedback on Page 1
            const feedbackBox = document.getElementById("feedbackBox");
            const badge = document.getElementById("ratingBadge");
            badge.textContent = evaluation.label;
            badge.style.backgroundColor = evaluation.color;

            document.getElementById("ratingNote").textContent = evaluation.note;
            document.getElementById("quickMetrics").textContent = 
                `Distance: ${distance} km  •  Burned: ${calories} kcal`;
            feedbackBox.style.display = "block";

            // Save to database and clear step input
            saveRecordToDB(newRecord);
            document.getElementById("steps").value = "";
        });

        // Switch between "Log Steps" (Page 1) and "Analytics & Rings" (Page 2)
        function switchPage(pageId) {
            document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
            document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));

            document.getElementById(pageId).classList.add("active");
            if (pageId === "inputPage") {
                document.getElementById("navInputBtn").classList.add("active");
            } else {
                document.getElementById("navOutputBtn").classList.add("active");
                drawChart(); // Re-render canvas cleanly when Page 2 becomes visible
            }
        }

        /* ==============================================================
           5. CIRCULAR RINGS, GRAPH & HISTORY RENDERING (PAGE 2)
           ============================================================== */
        function refreshAnalyticsUI(focusRecord = null) {
            // Default to the most recent entry if none explicitly clicked
            const activeRecord = focusRecord || allRecords[allRecords.length - 1] || null;
            updateCircularRings(activeRecord);
            renderHistoryList();
            drawChart();
        }

        // Animate SVG stroke-dashoffset for circular progress rings
        function updateCircularRings(record) {
            const stepsRing = document.getElementById("stepsRing");
            const distRing = document.getElementById("distRing");
            const calRing = document.getElementById("calRing");
            const badge = document.getElementById("ringRatingBadge");

            if (!record) {
                stepsRing.style.strokeDashoffset = RING_CIRCUMFERENCE;
                distRing.style.strokeDashoffset = RING_CIRCUMFERENCE;
                calRing.style.strokeDashoffset = RING_CIRCUMFERENCE;
                document.getElementById("stepsRingText").textContent = "0";
                document.getElementById("distRingText").textContent = "0 km";
                document.getElementById("calRingText").textContent = "0";
                badge.textContent = "No Data";
                badge.style.backgroundColor = "#9ca3af";
                return;
            }

            // Calculate fill percentages (capped at 100% for full circle)
            const stepPct = Math.min(record.steps / DAILY_GOAL, 1);
            const distPct = Math.min(record.distance / 7.6, 1);   // ~7.6km = 10k steps
            const calPct = Math.min(record.calories / 400, 1);    // ~400kcal = 10k steps

            stepsRing.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - stepPct);
            distRing.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - distPct);
            calRing.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - calPct);

            document.getElementById("stepsRingText").textContent = record.steps.toLocaleString();
            document.getElementById("distRingText").textContent = `${record.distance}km`;
            document.getElementById("calRingText").textContent = `${record.calories}`;

            document.getElementById("ringCardTitle").textContent = `Summary (${record.date})`;
            badge.textContent = record.rating;
            badge.style.backgroundColor = record.color;
            document.getElementById("selectedDayNote").textContent = record.note;
        }

        // Render clickable database history list
        function renderHistoryList() {
            const list = document.getElementById("historyList");
            document.getElementById("recordCount").textContent = `${allRecords.length} entries`;

            if (allRecords.length === 0) {
                list.innerHTML = "<p style='color:#6b7280; font-size:14px; text-align:center;'>No database records yet.</p>";
                return;
            }

            list.innerHTML = "";
            // Show newest entries first
            [...allRecords].reverse().forEach(rec => {
                const li = document.createElement("li");
                li.className = "history-item";
                li.style.borderLeftColor = rec.color;
                li.onclick = () => updateCircularRings(rec);

                li.innerHTML = `
                    <button class="delete-btn" onclick="deleteRecord(${rec.id}, event)">✕</button>
                    <div style="font-size:13px; color:#6b7280; font-weight:600;">${rec.date} at ${rec.time}</div>
                    <div style="font-size:16px; font-weight:700; margin:3px 0;">
                        ${rec.steps.toLocaleString()} steps 
                        <span style="background:${rec.color}; color:white; font-size:11px; padding:2px 8px; border-radius:10px; margin-left:6px;">
                            ${rec.rating}
                        </span>
                    </div>
                    <div style="font-size:12px; color:#4b5563;">${rec.distance} km • ${rec.calories} kcal — <em>${rec.note}</em></div>
                `;
                list.appendChild(li);
            });
        }

        // Toggle between Bar Chart and Line Chart
        document.getElementById("toggleChartBtn").addEventListener("click", (e) => {
            chartType = chartType === "bar" ? "line" : "bar";
            e.target.textContent = chartType === "bar" ? "Switch to Line" : "Switch to Bar";
            drawChart();
        });

        // Render custom HTML5 Canvas chart for recent step history
        function drawChart() {
            const canvas = document.getElementById("stepChart");
            const ctx = canvas.getContext("2d");
            const width = canvas.width;
            const height = canvas.height;

            ctx.clearRect(0, 0, width, height);

            const recent = allRecords.slice(-7); // Show last 7 logged entries
            if (recent.length === 0) {
                ctx.fillStyle = "#9ca3af";
                ctx.font = "14px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Log steps to generate your trend chart", width / 2, height / 2);
                return;
            }

            const padding = { top: 20, right: 20, bottom: 30, left: 45 };
            const chartW = width - padding.left - padding.right;
            const chartH = height - padding.top - padding.bottom;
            const maxSteps = Math.max(DAILY_GOAL * 1.2, ...recent.map(r => r.steps));

            // Draw 10,000-step dashed benchmark line
            const goalY = padding.top + chartH * (1 - DAILY_GOAL / maxSteps);
            ctx.save();
            ctx.strokeStyle = "#d87093";
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(padding.left, goalY);
            ctx.lineTo(width - padding.right, goalY);
            ctx.stroke();
            ctx.fillStyle = "#d87093";
            ctx.font = "10px sans-serif";
            ctx.fillText("10k Goal", padding.left + 4, goalY - 4);
            ctx.restore();

            // Draw axes
            ctx.strokeStyle = "#d1d5db";
            ctx.beginPath();
            ctx.moveTo(padding.left, padding.top);
            ctx.lineTo(padding.left, height - padding.bottom);
            ctx.lineTo(width - padding.right, height - padding.bottom);
            ctx.stroke();

            const stepGap = chartW / recent.length;

            if (chartType === "bar") {
                recent.forEach((rec, i) => {
                    const barW = Math.min(32, stepGap * 0.6);
                    const barH = (rec.steps / maxSteps) * chartH;
                    const x = padding.left + i * stepGap + (stepGap - barW) / 2;
                    const y = height - padding.bottom - barH;

                    ctx.fillStyle = rec.color || "#689c82";
                    ctx.fillRect(x, y, barW, barH);

                    // Date label on X-axis
                    ctx.fillStyle = "#4b5563";
                    ctx.font = "11px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(rec.date.slice(5), x + barW / 2, height - 10);
                });
            } else {
                // Line chart mode
                ctx.strokeStyle = "#689c82";
                ctx.lineWidth = 3;
                ctx.beginPath();

                recent.forEach((rec, i) => {
                    const x = padding.left + i * stepGap + stepGap / 2;
                    const y = height - padding.bottom - (rec.steps / maxSteps) * chartH;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();

                // Draw data points & labels
                recent.forEach((rec, i) => {
                    const x = padding.left + i * stepGap + stepGap / 2;
                    const y = height - padding.bottom - (rec.steps / maxSteps) * chartH;

                    ctx.fillStyle = rec.color || "#d87093";
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#4b5563";
                    ctx.font = "11px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(rec.date.slice(5), x, height - 10);
                });
            }
        }
    </script>
</body>
</html>

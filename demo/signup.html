
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Health Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="signup-body">

<div class="signup-box">
    <h1>Create Account</h1>
    <p>Join Health Tracker and take care of your health.</p>

    <form id="signupForm">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" placeholder="Enter your full name" required>

        <label for="signupEmail">Email Address</label>
        <input type="email" id="signupEmail" placeholder="Enter your email" required>

        <label for="signupAge">Age</label>
        <input type="number" id="signupAge" min="1" max="120" placeholder="Enter your age" required>

        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" minlength="6" placeholder="Create a password" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" minlength="6" placeholder="Confirm your password" required>

        <button type="submit" class="btn full-btn">Sign Up</button>
        <p id="signupMessage" class="message"></p>
    </form>

    <p class="login-link">
        Already have an account? <a href="login.html">Login</a>
    </p>
</div>

<script src="script.js"></script>
</body>
</html>
